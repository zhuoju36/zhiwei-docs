server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 支持 VitePress cleanUrls（链接不带 .html 后缀）
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
